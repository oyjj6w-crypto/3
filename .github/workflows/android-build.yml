            openssl pkcs12 -export \
              -in /tmp/fixed_cert.pem \
              -inkey /tmp/fixed_key.pem \
              -out app/debug.keystore \
              -name androiddebugkey \
              -password pass:android
            rm -f /tmp/fixed_key.pem /tmp/fixed_cert.pem
          fi
          echo "debug.keystore is present: $(ls -la app/debug.keystore)"

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradingMultiView-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Auto Publish GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
